<!DOCTYPE html>
<html>
<head>
    <style>
        .chat-container {
            width: 100%;
            height: 80vh;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }

        .user-message {
            margin-left: auto;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
        }

        .assistant-message {
            margin-right: auto;
            background: white;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .chat-input {
            display: flex;
            padding: 20px;
            border-top: 1px solid #eee;
            background: white;
            align-items: center;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
        }

        .chat-input button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            margin: 0 5px;
        }

        .chat-input button:hover {
            background: #0056b3;
        }

        .recording {
            animation: pulse 1.5s infinite;
            background: #dc3545 !important;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .loading {
            display: none;
            margin: 10px auto;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant-message">
                ¡Hola! ¿En qué puedo ayudarte? Puedes escribir o usar el micrófono para hablar.
            </div>
        </div>
        <div class="loading" id="loading">
            Procesando...
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje aquí...">
            <button id="micButton" onclick="toggleRecording()">🎤</button>
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        let isRecording = false;
        let recognition = null;

        // Configurar el reconocimiento de voz
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'es-ES';
                recognition.continuous = false;
                recognition.interimResults = false;

                recognition.onresult = async function(event) {
                    const transcript = event.results[0][0].transcript;
                    document.getElementById('messageInput').value = transcript;
                    // Enviar automáticamente el mensaje cuando se complete la transcripción
                    await sendMessage();
                };

                recognition.onend = function() {
                    isRecording = false;
                    document.getElementById('micButton').classList.remove('recording');
                };
            }
        }

        // Alternar grabación de audio
        function toggleRecording() {
            if (!recognition) {
                setupSpeechRecognition();
            }

            if (!isRecording) {
                recognition.start();
                isRecording = true;
                document.getElementById('micButton').classList.add('recording');
            } else {
                recognition.stop();
                isRecording = false;
                document.getElementById('micButton').classList.remove('recording');
            }
        }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            const loading = document.getElementById('loading');
            
            if (message) {
                // Añadir mensaje del usuario
                addMessage(message, 'user-message');
                
                // Mostrar indicador de carga
                loading.style.display = 'block';
                
                try {
                    // Enviar mensaje al webhook
                    const response = await fetch('https://n8n-sn4a.onrender.com/webhook-test/453e40c9-a590-4a7b-a92c-b7f733c66727', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message
                        })
                    });

                    // Esperar y procesar la respuesta
                    const data = await response.json();
                    
                    // Añadir la respuesta al chat
                    if (data && data.message) {
                        addMessage(data.message, 'assistant-message');
                    } else {
                        addMessage('No se recibió una respuesta válida del servidor.', 'assistant-message');
                    }
                    
                } catch (error) {
                    console.error('Error:', error);
                    addMessage('Lo siento, ha ocurrido un error al procesar tu mensaje.', 'assistant-message');
                }
                
                // Ocultar indicador de carga
                loading.style.display = 'none';
                
                // Limpiar input
                input.value = '';
            }
        }

        function addMessage(text, className) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Permitir enviar con Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Inicializar reconocimiento de voz
        setupSpeechRecognition();
    </script>
</body>
</html>
