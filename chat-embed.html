<!DOCTYPE html>
<html>
<head>
    <style>
        .chat-container {
            width: 100%;
            height: 80vh; /* Ocupará el 80% de la altura de la ventana */
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }

        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 15px;
            max-width: 80%;
        }

        .user-message {
            margin-left: auto;
            background: #007bff;
            color: white;
            padding: 10px 15px;
            border-radius: 15px 15px 0 15px;
        }

        .assistant-message {
            margin-right: auto;
            background: white;
            padding: 10px 15px;
            border-radius: 15px 15px 15px 0;
            box-shadow: 0 1px 2px rgba(0,0,0,0.1);
        }

        .chat-input {
            display: flex;
            padding: 20px;
            border-top: 1px solid #eee;
            background: white;
        }

        .chat-input input {
            flex-grow: 1;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-right: 10px;
        }

        .chat-input button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 20px;
            cursor: pointer;
        }

        .chat-input button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
            <div class="message assistant-message">
                ¡Hola! ¿En qué puedo ayudarte?
            </div>
        </div>
        <div class="chat-input">
            <input type="text" id="messageInput" placeholder="Escribe tu mensaje aquí...">
            <button onclick="sendMessage()">Enviar</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (message) {
                // Añadir mensaje del usuario
                addMessage(message, 'user-message');
                
                // Simular respuesta del asistente
                setTimeout(() => {
                    addMessage('Este es un mensaje de ejemplo del asistente. En una implementación real, aquí iría la respuesta de tu API.', 'assistant-message');
                }, 1000);
                
                // Limpiar input
                input.value = '';
            }
        }

        function addMessage(text, className) {
            const messagesContainer = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.textContent = text;
            messagesContainer.appendChild(messageDiv);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Permitir enviar con Enter
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });
    </script>
</body>
</html>
